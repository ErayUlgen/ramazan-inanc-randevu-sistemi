services:
  postgres:
    image: postgres:16-alpine
    container_name: ramazan-inanc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ramazan_inanc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-development-password}
      POSTGRES_DB: ${POSTGRES_DB:-ramazan_inanc_booking}
    ports:
      - '${POSTGRES_PORT:-5434}:5432'
    volumes:
      - ramazan_inanc_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-ramazan_inanc} -d ${POSTGRES_DB:-ramazan_inanc_booking}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ramazan_inanc_postgres_data:

