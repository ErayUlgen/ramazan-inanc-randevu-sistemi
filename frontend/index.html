<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f7fb" />
    <meta name="color-scheme" content="light" />
    <link
      rel="icon"
      type="image/png"
      sizes="64x64"
      href="/brand/ramazan-inanc-favicon.png"
    />
    <!--
      Ana rezervasyon ekranındaki kahraman videosunun poster'ı (5,9 KB).
      Bu bir React SPA olduğu için <video poster> yalnız istemci tarafında,
      JS mount olduktan sonra DOM'a giriyor; tarayıcının önyükleme
      tarayıcısı onu ilk belgede göremiyordu ve LCP'de ~2,1 saniyelik "load
      delay" üretiyordu (12.08.2026 doğrulamasında ölçüldü). Diğer
      rotalarda (admin, müşteri hesabı) gösterilmese de 5,9 KB'lık maliyeti
      bu kazanca değer; koşullu önyükleme statik index.html'de mümkün değil.
    -->
    <link
      rel="preload"
      as="image"
      href="/media/ramazan-inanc-studio-poster.jpg"
      fetchpriority="high"
    />
    <meta name="description" content="Ramazan İnanç Hair Art Studio için premium online randevu deneyimi." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Ramazan İnanç Hair Art Studio" />
    <meta property="og:title" content="Online Randevu | Ramazan İnanç Hair Art Studio" />
    <meta property="og:description" content="Denizli Merkezefendi'de anatomik saç kesimi ve sakal tasarımı. Hizmetini ve saatini seç, randevunu online al." />
    <meta property="og:locale" content="tr_TR" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>Online Randevu | Ramazan İnanç Hair Art Studio</title>
    <!--
      Yerel işletme yapılandırılmış verisi. Değerler şube kaydından alınmıştır;
      çalışma saatleri branch_weekly_intervals ile birebir aynıdır (Cuma 19.00,
      diğer günler 21.00). Saatler veya adres değişirse burası da güncellenmelidir.
    -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "Ramazan İnanç Hair Art Studio",
        "description": "Anatomik saç kesimi ve sakal tasarımı stüdyosu.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Yenişafak, 1037 Sk. A Blok No.4 AB",
          "addressLocality": "Merkezefendi",
          "addressRegion": "Denizli",
          "postalCode": "20300",
          "addressCountry": "TR"
        },
        "telephone": "+905442631902",
        "hasMap": "https://www.google.com/maps/place//data=!4m2!3m1!1s0x14c741125ac99709:0xad2bff10cae2c3ed",
        "currenciesAccepted": "TRY",
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": [
              "Sunday",
              "Monday",
              "Tuesday",
              "Wednesday",
              "Thursday",
              "Saturday"
            ],
            "opens": "10:00",
            "closes": "21:00"
          },
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": "Friday",
            "opens": "10:00",
            "closes": "19:00"
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
